services:
  postgres:
    image: postgres:16-alpine
    container_name: rokad_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rokad_user
      POSTGRES_PASSWORD: rokad_password
      POSTGRES_DB: rokad_attendance_db
    ports:
      - "54320:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rokad_user -d rokad_attendance_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rokad_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
